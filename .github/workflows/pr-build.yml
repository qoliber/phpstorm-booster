name: PR Build

# Builds, tests and verifies the plugin for pull requests only. The zip is
# uploaded as an artifact; pr-comment.yml then posts its download link on the PR.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JBR 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew buildPlugin test --stacktrace

      # Checks binary compatibility against every IDE listed in
      # pluginVerifierIdeVersions (gradle.properties).
      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          path: build/distributions/*.zip
          archive: false
          retention-days: 14
          if-no-files-found: error
