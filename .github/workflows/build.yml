name: Build Plugin

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # build.gradle.kts uses jvmToolchain(25), matching the JBR 25 runtime
      # that PhpStorm 2026.x ships with.
      - name: Set up JBR 25
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin test --stacktrace

      # Checks binary compatibility against every IDE listed in
      # pluginVerifierIdeVersions (gradle.properties).
      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: phpstorm-booster-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
